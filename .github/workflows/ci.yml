name: CI

on:
  push:
    branches: [main, master, 'codex/marketplace-owner-*']
  pull_request:
    branches: [main, master, 'codex/marketplace-owner-*']

jobs:
  backend:
    name: Backend build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore ECommerce.sln

      - name: Build
        run: dotnet build ECommerce.sln --no-restore -c Release

      - name: Test
        run: dotnet test ECommerce.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/test-results.trx"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Test
        run: npm test

  windows-sql-migration:
    name: SQL Server LocalDB migration + trigger
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Start disposable LocalDB instances
        shell: pwsh
        run: |
          if (-not (Get-Command sqllocaldb -ErrorAction SilentlyContinue)) {
            throw "SQL Server LocalDB is not installed on this runner."
          }

          $instances = @(
            "MarketplaceSafetyTestMigration",
            "MarketplaceSafetyTestOwnerCatalog"
          )
          foreach ($instance in $instances) {
            & sqllocaldb create $instance
            if ($LASTEXITCODE -ne 0) { throw "Could not create LocalDB instance $instance." }
            & sqllocaldb start $instance
            if ($LASTEXITCODE -ne 0) { throw "Could not start LocalDB instance $instance." }
          }

          "MARKETPLACE_MIGRATION_TEST_CONNECTION=Server=(localdb)\MarketplaceSafetyTestMigration;Database=ECommerceDb_Dev;Integrated Security=true;TrustServerCertificate=true" >> $env:GITHUB_ENV
          "MARKETPLACE_OWNER_CATALOG_TEST_CONNECTION=Server=(localdb)\MarketplaceSafetyTestOwnerCatalog;Database=ECommerceDb_Dev;Integrated Security=true;TrustServerCertificate=true" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore ECommerce.sln

      - name: Run opt-in SQL migration tests
        run: >
          dotnet test tests/ECommerce.Tests/ECommerce.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~Populated_preV2_upgrade_backfills_unique_skus|FullyQualifiedName~Owner_catalog_migration_enforces_seller_fk_and_checkout_snapshot"

      - name: Stop disposable LocalDB instances
        if: always()
        shell: pwsh
        run: |
          foreach ($instance in @("MarketplaceSafetyTestMigration", "MarketplaceSafetyTestOwnerCatalog")) {
            & sqllocaldb stop $instance -k 2>$null
            & sqllocaldb delete $instance 2>$null
          }
